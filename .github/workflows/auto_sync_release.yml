name: Sync Upstream & Release Custom Fork

on:
  schedule:
    # Runs every 6 hours to check for upstream Home Assistant Core updates
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - feature/hardware-stability
    paths-ignore:
      - 'README.md'
      - '.ai_notes/**'
      - 'docs/**'
      - '.agents/**'

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          ref: feature/hardware-stability
          fetch-depth: 0

      - name: Fetch Upstream Home Assistant Version & Determine Tag
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(gh api repos/home-assistant/core/releases/latest --jq '.tag_name')
          UPSTREAM_VERSION="${UPSTREAM_TAG#v}"
          echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> $GITHUB_ENV
          echo "UPSTREAM_VERSION=$UPSTREAM_VERSION" >> $GITHUB_ENV

          # Check for existing releases in the fork matching UPSTREAM_TAG-custom.<number>
          EXISTING_RELEASES=$(gh api repos/${{ github.repository }}/releases --jq ".[].tag_name | select(test(\"^${UPSTREAM_TAG}-custom\\\\.[0-9]+$\"))" || true)

          if [ -z "$EXISTING_RELEASES" ]; then
            echo "New upstream version detected ($UPSTREAM_TAG) or no prior releases matching pattern."
            NEXT_NUM=1
            IS_NEW_UPSTREAM=true
            SHOULD_RELEASE=true
          else
            # Extract the highest numeric suffix
            LATEST_NUM=$(echo "$EXISTING_RELEASES" | sed -E "s/.*-custom\.([0-9]+)/\1/" | sort -n | tail -n 1)
            LATEST_FORK_TAG="${UPSTREAM_TAG}-custom.${LATEST_NUM}"
            echo "Found latest fork release for $UPSTREAM_TAG: $LATEST_FORK_TAG"

            git fetch origin --tags 2>/dev/null || true
            if git rev-parse "refs/tags/${LATEST_FORK_TAG}" >/dev/null 2>&1; then
              COMMITS_AHEAD=$(git rev-list "refs/tags/${LATEST_FORK_TAG}..HEAD" --count)
            else
              COMMITS_AHEAD=1
            fi

            if [ "$COMMITS_AHEAD" -gt 0 ]; then
              echo "Branch has $COMMITS_AHEAD new commit(s) ahead of $LATEST_FORK_TAG. Bumping fork patch version."
              NEXT_NUM=$((LATEST_NUM + 1))
              IS_NEW_UPSTREAM=false
              SHOULD_RELEASE=true
            else
              echo "No new commits since $LATEST_FORK_TAG. Skipping release."
              NEXT_NUM="$LATEST_NUM"
              IS_NEW_UPSTREAM=false
              SHOULD_RELEASE=false
            fi
          fi

          MY_TAG="${UPSTREAM_TAG}-custom.${NEXT_NUM}"
          MY_VERSION="${UPSTREAM_VERSION}-custom.${NEXT_NUM}"

          echo "IS_NEW_UPSTREAM=$IS_NEW_UPSTREAM" >> $GITHUB_ENV
          echo "SHOULD_RELEASE=$SHOULD_RELEASE" >> $GITHUB_ENV
          echo "MY_TAG=$MY_TAG" >> $GITHUB_ENV
          echo "MY_VERSION=$MY_VERSION" >> $GITHUB_ENV

      - name: Sync Upstream Component & Apply Custom Patches
        if: env.SHOULD_RELEASE == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$IS_NEW_UPSTREAM" = "true" ]; then
            echo "Downloading upstream components/openrgb from Home Assistant Core $UPSTREAM_TAG..."
            TMP_DIR=$(mktemp -d)
            curl -sL "https://github.com/home-assistant/core/archive/refs/tags/${UPSTREAM_TAG}.tar.gz" | tar -xz -C "$TMP_DIR"
            
            # Re-apply our custom patches over upstream files
            if [ -d "$TMP_DIR/core-${UPSTREAM_VERSION}/homeassistant/components/openrgb" ]; then
              echo "Upstream openrgb component located. Preserving custom patches..."
              # Backup our customized files
              cp custom_components/openrgb/coordinator.py /tmp/coord_backup.py
              cp custom_components/openrgb/__init__.py /tmp/init_backup.py
              cp custom_components/openrgb/light.py /tmp/light_backup.py
              cp custom_components/openrgb/config_flow.py /tmp/config_flow_backup.py
              cp custom_components/openrgb/const.py /tmp/const_backup.py

              # Sync fresh files
              rm -rf custom_components/openrgb/*
              cp -r "$TMP_DIR/core-${UPSTREAM_VERSION}/homeassistant/components/openrgb/"* custom_components/openrgb/

              # Restore customized files
              cp /tmp/coord_backup.py custom_components/openrgb/coordinator.py
              cp /tmp/init_backup.py custom_components/openrgb/__init__.py
              cp /tmp/light_backup.py custom_components/openrgb/light.py
              cp /tmp/config_flow_backup.py custom_components/openrgb/config_flow.py
              cp /tmp/const_backup.py custom_components/openrgb/const.py
            fi
            rm -rf "$TMP_DIR"
          fi

          echo "Updating manifest.json version to $MY_VERSION..."
          jq --arg ver "$MY_VERSION" '.version = $ver' custom_components/openrgb/manifest.json > custom_components/openrgb/manifest.json.tmp
          mv custom_components/openrgb/manifest.json.tmp custom_components/openrgb/manifest.json

          git add custom_components/openrgb/
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to ${MY_TAG} [skip ci]"
          fi

          git push origin feature/hardware-stability --force-with-lease

      - name: Package & Create Release in Fork
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd custom_components
          zip -r ../openrgb.zip openrgb
          cd ..

          gh release create "$MY_TAG" openrgb.zip \
            --target feature/hardware-stability \
            --title "$MY_TAG" \
            --notes "Custom OpenRGB release synchronized with Home Assistant Core $UPSTREAM_TAG with Razer/Asus hardware reconnection and stable ID patches."
